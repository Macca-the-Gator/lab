name: Macca Blog Publisher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gta-blog.yml'
      - 'scripts/blog.mjs'
      - 'scripts/growth_v2.mjs'
      - 'scripts/article_covers.py'
      - 'scripts/search_console.py'
      - 'scripts/indexnow.mjs'
      - 'scripts/test-engagement.mjs'
      - 'scripts/test-growth.mjs'
      - 'blog/assets/blog.css'
      - 'blog/assets/growth.css'
      - 'blog/assets/engagement.js'
      - 'analytics/**'
      - 'scripts/build-seo.mjs'
      - 'scripts/instagram.mjs'
      - 'scripts/social_video.py'
      - 'scripts/youtube_queue.py'
      - 'src/youtube/shorts.py'
      - 'requirements-youtube.txt'
      - 'blog/instagram-queue.json'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      retroactive_backfill:
        description: Search the last 21 days and generate a retroactive batch
        type: boolean
        default: false
      posts_to_generate:
        description: Maximum articles (up to 50 when retroactive backfill is enabled)
        type: choice
        options: ['1', '3', '5', '10', '25', '50']
        default: '1'

permissions:
  contents: write

concurrency:
  group: macca-blog-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[short-render-preview-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan feeds for new GTA or Rockstar coverage without AI
        id: monitor
        if: github.event_name == 'schedule'
        env:
          CANDIDATE_FILE: ${{ runner.temp }}/macca-blog-candidate.json
        run: node scripts/blog.mjs monitor
      - name: Research and generate an article when a novel sourced topic exists
        id: ai_generation
        if: (github.event_name != 'push' || !contains(github.event.head_commit.message, '[social-video-code-only]')) && ((github.event_name != 'schedule' && !contains(github.event.head_commit.message, '[instagram-retry]')) || steps.monitor.outputs.should_generate == 'true')
        continue-on-error: true
        env:
          SITE_URL: https://macca-lab.onrender.com
          CANDIDATE_FILE: ${{ runner.temp }}/macca-blog-candidate.json
          MAX_POSTS_PER_RUN: ${{ github.event.inputs.posts_to_generate || '1' }}
          INSTAGRAM_QUEUE_FILE: blog/instagram-queue.json
          YOUTUBE_QUEUE_FILE: blog/youtube-queue.json
          BACKFILL_FLAG: ${{ github.event.inputs.retroactive_backfill == 'true' && '--backfill' || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/blog.mjs generate ${BACKFILL_FLAG} --count=${MAX_POSTS_PER_RUN}
      - name: Record a retry cooldown when scheduled generation fails
        id: record_failure
        if: github.event_name == 'schedule' && steps.monitor.outputs.should_generate == 'true' && steps.ai_generation.outcome == 'failure'
        env:
          CANDIDATE_FILE: ${{ runner.temp }}/macca-blog-candidate.json
        run: node scripts/blog.mjs record-monitor-failure
      - name: Set up Python for branded article covers
        if: github.event_name != 'schedule' || (steps.monitor.outputs.should_generate == 'true' && steps.ai_generation.outcome == 'success')
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate original article social cards
        id: article_covers
        if: github.event_name != 'schedule' || (steps.monitor.outputs.should_generate == 'true' && steps.ai_generation.outcome == 'success')
        run: |
          python -m pip install 'Pillow>=10,<13'
          python -m scripts.article_covers
      - name: Build all blog indexes, feeds and sitemaps
        id: build_blog
        if: github.event_name != 'schedule' || (steps.monitor.outputs.should_generate == 'true' && steps.ai_generation.outcome == 'success')
        env:
          SITE_URL: https://macca-lab.onrender.com
        run: node scripts/blog.mjs build
      - name: Validate reader recirculation UI
        id: test_engagement
        if: github.event_name != 'schedule' || (steps.monitor.outputs.should_generate == 'true' && steps.ai_generation.outcome == 'success')
        run: node scripts/test-engagement.mjs
      - name: Build whole-site SEO metadata and discovery files
        id: build_seo
        if: github.event_name != 'schedule' || (steps.monitor.outputs.should_generate == 'true' && steps.ai_generation.outcome == 'success')
        env:
          SITE_URL: https://macca-lab.onrender.com
        run: node scripts/build-seo.mjs
      - name: Validate growth, social and monetization pipeline
        id: test_growth
        if: github.event_name != 'schedule' || (steps.monitor.outputs.should_generate == 'true' && steps.ai_generation.outcome == 'success')
        run: |
          node scripts/test-growth.mjs
          node --check scripts/blog.mjs
          node --check scripts/growth_v2.mjs
          node --check scripts/indexnow.mjs
          node --check scripts/instagram.mjs
          node --check scripts/instagram_metrics.mjs
          node --check analytics/web-analytics.js
          python -m py_compile scripts/article_covers.py scripts/search_console.py scripts/youtube_metrics.py scripts/youtube_queue.py scripts/youtube_weekly.py scripts/social_video.py src/youtube/shorts.py src/youtube/upload.py
      - name: Check whether social video queues contain work
        id: social_video_work
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const files = ['blog/youtube-queue.json', 'blog/instagram-queue.json'];
          let pending = 0;
          for (const file of files) {
            try { const value = JSON.parse(fs.readFileSync(file, 'utf8')); if (Array.isArray(value)) pending += value.length; }
            catch (error) { if (error.code !== 'ENOENT') throw error; }
          }
          console.log(`${pending} queued social item(s).`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_work=${pending > 0}\n`);
          NODE
      - name: Set up Python for shared social videos
        if: always() && (hashFiles('blog/youtube-queue.json') != '' || steps.social_video_work.outputs.has_work == 'true')
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-youtube.txt
            requirements-kokoro.txt
      - name: Cache Kokoro model and voice weights
        if: always() && (hashFiles('blog/youtube-queue.json') != '' || steps.social_video_work.outputs.has_work == 'true')
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: kokoro-${{ runner.os }}-hexgrad-82m-am-michael-v1
          restore-keys: |
            kokoro-${{ runner.os }}-hexgrad-82m-
      - name: Install shared video renderer dependencies
        id: install_social_renderer
        if: always() && steps.build_blog.outcome != 'failure' && steps.build_seo.outcome != 'failure' && (hashFiles('blog/youtube-queue.json') != '' || steps.social_video_work.outputs.has_work == 'true')
        continue-on-error: true
        run: python -m pip install -r requirements-youtube.txt -r requirements-kokoro.txt
      - name: Install FFmpeg and local TTS for queued videos
        id: install_video_system_deps
        if: always() && steps.social_video_work.outputs.has_work == 'true' && steps.build_blog.outcome != 'failure' && steps.build_seo.outcome != 'failure'
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - name: Render shared narrated videos for queued articles
        id: render_social_videos
        if: always() && steps.install_social_renderer.outcome != 'failure' && steps.install_video_system_deps.outcome != 'failure' && steps.build_blog.outcome != 'failure' && steps.build_seo.outcome != 'failure' && steps.social_video_work.outputs.has_work == 'true'
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SITE_URL: https://macca-lab.onrender.com
          SHORTS_RENDERER: ${{ vars.SHORTS_RENDERER || 'narrated' }}
          KOKORO_VOICE: am_michael
          SOCIAL_VIDEO_DIR: ${{ runner.temp }}/macca-social-videos
          INSTAGRAM_REEL_MANIFEST_FILE: ${{ runner.temp }}/macca-reel-manifest.json
          R2_USAGE_FILE: blog/r2-upload-usage.json
          INSTAGRAM_RETRY_ONLY_FIRST: ${{ contains(github.event.head_commit.message, '[instagram-retry]') && 'true' || 'false' }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_PUBLIC_BASE_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_BASE_URL }}
        run: python -m scripts.social_video
      - name: Validate rendered vertical MP4
        if: steps.render_social_videos.outcome == 'success'
        env:
          SOCIAL_VIDEO_DIR: ${{ runner.temp }}/macca-social-videos
          INSTAGRAM_REEL_MANIFEST_FILE: ${{ runner.temp }}/macca-reel-manifest.json
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          video_dir = Path(os.environ['SOCIAL_VIDEO_DIR'])
          manifest_file = Path(os.environ['INSTAGRAM_REEL_MANIFEST_FILE'])
          try:
              manifest = json.loads(manifest_file.read_text(encoding='utf-8'))
          except FileNotFoundError:
              manifest = {"videos": {}}
          slugs = list((manifest.get("videos") or {}).keys())
          for slug in slugs:
              video = video_dir / f'{slug}.mp4'
              probe = json.loads(subprocess.check_output([
                  'ffprobe', '-v', 'error', '-show_entries',
                  'stream=codec_type,codec_name,width,height,r_frame_rate',
                  '-show_entries', 'format=duration', '-of', 'json', str(video)
              ], text=True))
              streams = probe['streams']
              video_stream = next(stream for stream in streams if stream['codec_type'] == 'video')
              audio_stream = next(stream for stream in streams if stream['codec_type'] == 'audio')
              duration = float(probe['format']['duration'])
              assert (video_stream['codec_name'], video_stream['width'], video_stream['height'], video_stream['r_frame_rate']) == ('h264', 1080, 1920, '30/1'), video_stream
              assert audio_stream['codec_name'] == 'aac', audio_stream
              assert 15 <= duration <= 25, duration
              print(f'Validated {video.name}: H.264 1080x1920, AAC, 30 FPS, {duration:.2f}s.')
          PY
      - name: Inspect pending Instagram posts
        id: instagram_queue
        if: always()
        env:
          INSTAGRAM_QUEUE_FILE: blog/instagram-queue.json
          INSTAGRAM_FORCE_REGENERATE: 'true'
        run: node scripts/instagram.mjs inspect
      - name: Install ImageMagick for branded Instagram artwork
        id: install_imagemagick
        if: steps.instagram_queue.outputs.needs_artwork == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick fonts-dejavu-core
      - name: Create square Instagram images for queued stories
        id: prepare_instagram
        if: always() && steps.instagram_queue.outcome == 'success' && steps.install_imagemagick.outcome != 'failure'
        env:
          SITE_URL: https://macca-lab.onrender.com
          INSTAGRAM_QUEUE_FILE: blog/instagram-queue.json
          INSTAGRAM_FORCE_REGENERATE: 'true'
          INSTAGRAM_RETRY_ONLY_FIRST: ${{ contains(github.event.head_commit.message, '[instagram-retry]') && 'true' || 'false' }}
        run: node scripts/instagram.mjs prepare
      - name: Commit and push generated changes
        id: commit_generated
        if: always() && ((steps.build_blog.outcome == 'success' && steps.test_engagement.outcome == 'success' && steps.build_seo.outcome == 'success' && steps.test_growth.outcome == 'success' && steps.prepare_instagram.outcome == 'success' && (github.event_name != 'schedule' || steps.monitor.outputs.should_generate == 'true' || steps.social_video_work.outputs.has_work == 'true')) || steps.record_failure.outcome == 'success')
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Build blog artwork and whole-site SEO"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "No blog changes to publish."
          fi
      - name: Upload the reserved Reel object to R2
        if: always() && steps.render_social_videos.outcome == 'success' && steps.commit_generated.outcome != 'failure'
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          INSTAGRAM_REEL_MANIFEST_FILE: ${{ runner.temp }}/macca-reel-manifest.json
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_PUBLIC_BASE_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_BASE_URL }}
        run: python -m scripts.social_video upload
      - name: Publish new stories to Instagram
        id: instagram_publish
        if: always() && steps.instagram_queue.outcome == 'success' && steps.prepare_instagram.outcome == 'success' && steps.commit_generated.outcome != 'failure' && steps.build_blog.outcome != 'failure' && steps.build_seo.outcome != 'failure'
        env:
          SITE_URL: https://macca-lab.onrender.com
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_PAGE_ID: '1398291306701395'
          INSTAGRAM_BUSINESS_ACCOUNT_ID: '17841427029514284'
          INSTAGRAM_QUEUE_FILE: blog/instagram-queue.json
          INSTAGRAM_REEL_MANIFEST_FILE: ${{ runner.temp }}/macca-reel-manifest.json
          INSTAGRAM_RETRY_ONLY_FIRST: ${{ contains(github.event.head_commit.message, '[instagram-retry]') && 'true' || 'false' }}
        run: node scripts/instagram.mjs publish
      - name: Delete temporary Instagram Reel videos from R2
        if: always() && steps.render_social_videos.outcome != 'skipped'
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          INSTAGRAM_REEL_MANIFEST_FILE: ${{ runner.temp }}/macca-reel-manifest.json
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        run: python -m scripts.social_video cleanup
      - name: Save Instagram publication IDs
        if: always() && steps.instagram_publish.outcome != 'skipped' && hashFiles('blog/instagram-queue.json') != ''
        run: |
          git add blog/instagram-queue.json
          if [[ -f blog/instagram-published.json ]]; then
            git add blog/instagram-published.json
          fi
          if [[ -f blog/r2-upload-usage.json ]]; then
            git add blog/r2-upload-usage.json
          fi
          if git diff --cached --quiet; then
            echo "No new Instagram publication records."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Record Instagram blog publications"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Check YouTube OAuth secrets are configured
        id: youtube_config
        if: always() && !contains(github.event.head_commit.message, '[instagram-retry]') && hashFiles('blog/youtube-queue.json') != ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [[ -n "$YOUTUBE_CLIENT_ID" && -n "$YOUTUBE_CLIENT_SECRET" && -n "$YOUTUBE_REFRESH_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "YouTube secrets are not configured; queued Shorts remain available for retry."
          fi
      - name: Publish queued articles to YouTube as public Shorts
        id: youtube_publish
        if: always() && !contains(github.event.head_commit.message, '[instagram-retry]') && steps.commit_generated.outcome != 'failure' && steps.build_blog.outcome != 'failure' && steps.build_seo.outcome != 'failure' && steps.youtube_config.outputs.configured == 'true'
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_QUEUE_FILE: blog/youtube-queue.json
          YOUTUBE_PUBLISHED_FILE: blog/youtube-published.json
          SITE_URL: https://macca-lab.onrender.com
          SHORTS_RENDERER: ${{ vars.SHORTS_RENDERER || 'narrated' }}
          SOCIAL_VIDEO_DIR: ${{ runner.temp }}/macca-social-videos
        run: python -m scripts.youtube_queue
      - name: Save YouTube upload records and retained retry queue
        if: always() && !contains(github.event.head_commit.message, '[instagram-retry]') && steps.youtube_config.outcome != 'skipped' && steps.commit_generated.outcome != 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A blog/youtube-queue.json
          if [[ -f blog/youtube-published.json ]]; then git add blog/youtube-published.json; fi
          if git diff --cached --quiet; then
            echo "No YouTube queue changes to save."
          else
            git commit -m "Record YouTube blog Shorts publications"
            remaining_changes="$(git status --porcelain --untracked-files=all)"
            if [[ -n "$remaining_changes" ]]; then
              echo "::error::Refusing to rebase with uncommitted YouTube job changes."
              printf '%s\n' "$remaining_changes"
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
