name: Maintain Instagram publishing token

on:
  schedule:
    # Checks twice monthly. Instagram Login tokens are refreshed;
    # valid Facebook Page tokens are preserved, not exchanged.
    - cron: "23 6 1,15 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Check configuration or renew an eligible Instagram Login token"
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - renew
  push:
    paths:
      - ".github/workflows/instagram-token-rotation.yml"
      - "scripts/instagram_token_rotation.py"
      - "tests/test_instagram_token_rotation.py"
  pull_request:
    paths:
      - ".github/workflows/instagram-token-rotation.yml"
      - "scripts/instagram_token_rotation.py"
      - "tests/test_instagram_token_rotation.py"

permissions:
  contents: read

concurrency:
  group: macca-instagram-token-rotation
  cancel-in-progress: false

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline rotation tests
        run: python -m unittest discover -s tests -p 'test_instagram_token_rotation.py' -v

  rotate:
    if: github.repository == 'Macca-the-Gator/lab' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate or renew Instagram token (no social publishing changes)
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_TOKEN_ROTACION: ${{ secrets.INSTAGRAM_TOKEN_ROTACION }}
          RUN_MODE: ${{ github.event_name == 'schedule' && 'renew' || inputs.mode || 'preflight' }}
        run: python scripts/instagram_token_rotation.py "$RUN_MODE"
