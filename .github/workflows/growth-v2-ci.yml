name: Growth v2 safe CI

on:
  push:
    branches: ['chatgpt/growth-v2', 'chatgpt/growth-v2-final']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private Macca editorial code (read-only)
        uses: actions/checkout@v4
        with:
          repository: PkLavc/blog
          ref: main
          ssh-key: ${{ secrets.MACCA_ENGINE_DEPLOY_KEY }}
          persist-credentials: false
          path: .private-engine
          sparse-checkout: scripts/macca_engine
      - name: Verify the private editorial modules
        shell: bash
        run: |
          for file in blog.mjs blog_quality.mjs growth_v2.mjs; do
            test -s ".private-engine/scripts/macca_engine/$file" || { echo "::error::Private Macca engine is missing"; exit 1; }
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax checks
        run: |
          node --check scripts/blog.mjs
          node --check .private-engine/scripts/macca_engine/growth_v2.mjs
          node --check scripts/indexnow.mjs
          node --check scripts/instagram.mjs
          node --check scripts/instagram_metrics.mjs
          node --check ads/ads.js
          node --check analytics/web-analytics.js
          node --check skylet/worker/src/index.js
          python -m py_compile scripts/article_covers.py scripts/search_console.py scripts/youtube_metrics.py scripts/youtube_queue.py scripts/youtube_weekly.py scripts/social_video.py src/youtube/shorts.py src/youtube/upload.py
      - name: Build static blog and growth pages
        env:
          SITE_URL: https://macca-lab.onrender.com
        run: |
          node scripts/blog.mjs build
          node scripts/build-seo.mjs
      - name: Growth regression checks
        run: |
          node scripts/test-growth.mjs
          node scripts/test-engagement.mjs
