name: Optimize search metadata

on:
  schedule:
    - cron: '23 11 * * 3'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macca-search-optimization
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Checkout private Macca editorial code (read-only)
        uses: actions/checkout@v4
        with:
          repository: PkLavc/blog
          ref: main
          ssh-key: ${{ secrets.MACCA_ENGINE_DEPLOY_KEY }}
          persist-credentials: false
          path: .private-engine
          sparse-checkout: scripts/macca_engine
      - name: Verify the private editorial modules
        shell: bash
        run: |
          for file in blog.mjs blog_quality.mjs growth_v2.mjs; do
            test -s ".private-engine/scripts/macca_engine/$file" || { echo "::error::Private Macca engine is missing"; exit 1; }
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Improve up to three search-result snippets from Search Console demand
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/blog.mjs search-optimize
      - name: Validate generated site
        run: |
          node scripts/test-growth.mjs
          node --check scripts/blog.mjs
      - name: Save safe metadata improvements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog
          if git diff --cached --quiet; then
            echo "No search metadata changes."
          else
            git commit -m "Optimize Macca search snippets"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
