name: Optimize search metadata

on:
  schedule:
    - cron: '23 11 * * 3'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macca-search-optimization
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Audit public canonicals and internal links
        run: node scripts/seo-audit.mjs --output seo-audit.json
      - name: Save weekly SEO audit
        uses: actions/upload-artifact@v4
        with:
          name: macca-weekly-seo-audit
          path: seo-audit.json
          retention-days: 14
      - name: Check Search Console data before AI optimization
        id: demand
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          let data={};
          try{data=JSON.parse(fs.readFileSync('blog/search-console.json','utf8'));}catch{}
          const rows=Array.isArray(data.pageOpportunities)?data.pageOpportunities:[];
          const ok=rows.some(row=>Number(row.impressions)>=20&&Number(row.position)>0);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'has_demand='+ok+'\n');
          console.log(ok?'Verified SEO opportunities found.':'No verified Search Console demand; skipping private checkout and AI.');
          NODE
      - name: Checkout private Macca editorial code (read-only)
        if: steps.demand.outputs.has_demand == 'true'
        uses: actions/checkout@v4
        with:
          repository: PkLavc/blog
          ref: main
          ssh-key: ${{ secrets.MACCA_ENGINE_DEPLOY_KEY }}
          persist-credentials: false
          path: .private-engine
          sparse-checkout: scripts/macca_engine
      - name: Verify the private editorial modules
        if: steps.demand.outputs.has_demand == 'true'
        shell: bash
        run: |
          for file in blog.mjs blog_quality.mjs growth_v2.mjs; do
            test -s ".private-engine/scripts/macca_engine/$file" || { echo "::error::Private Macca engine is missing"; exit 1; }
          done
      - uses: actions/setup-node@v4
        if: steps.demand.outputs.has_demand == 'true'
        with:
          node-version: 22
      - name: Improve up to three search-result snippets from Search Console demand
        if: steps.demand.outputs.has_demand == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/blog.mjs search-optimize
      - name: Validate generated site
        if: steps.demand.outputs.has_demand == 'true'
        run: |
          node scripts/test-growth.mjs
          node --check scripts/blog.mjs
      - name: Save safe metadata improvements
        if: steps.demand.outputs.has_demand == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog
          if git diff --cached --quiet; then
            echo "No search metadata changes."
          else
            git commit -m "Optimize Macca search snippets"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
